[gcode_macro UNLOAD_FILAMENT]
gcode:
  {% if printer.mmu and printer.mmu.enabled %}
    MMU_EJECT
  {% else %}
    PURGE
    CUT_TIP
    G1 E-75 F1200
  {% endif %}

[gcode_macro LOAD_FILAMENT]
variable_load_distance:  50
variable_purge_distance:  25
gcode:
    {% if printer.mmu and printer.mmu.enabled %}
        MMU_LOAD
    {% else %}
      SAVE_GCODE_STATE NAME=load_state
      _LOW_TEMP_CHECK WAIT=0
      PARK_PURGE
      _LOW_TEMP_CHECK
      G1 E20 F300
      G1 E50 F1200
      _LOW_TEMP_CHECK
      WIPE PURGE=25
      G1 E-20 F1500
      G1 E30 F1500
      G1 E-25 F3000
      WIPE COUNT=4
      RESTORE_GCODE_STATE NAME=load_state
    {% endif %}
